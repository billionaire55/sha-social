name: Kie.ai Image Sample (Test Only)
on:
  workflow_dispatch:
    inputs:
      test_prompt:
        description: "Prompt to test (leave blank to use the default sample prompt)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Kie.ai sample image
        env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          TEST_PROMPT: ${{ github.event.inputs.test_prompt }}
        run: node generate_image_kie_sample.js

      - name: Upload sample image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kie-sample-image
          path: kie_sample_image.png
          retention-days: 7
